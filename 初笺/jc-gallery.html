<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>角初笺 · 背景头像库</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Bebas+Neue&family=Space+Mono:wght@400;700&family=Cormorant+Garamond:ital,wght@0,300;0,500;1,300&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="jc-base.css" />
<link rel="stylesheet" href="jc-sub.css" />
</head>
<body>
<div class="phone-wrap"><div class="phone-frame">
  <div class="bg-glow"></div>
  <div class="paper-grain"></div>

  <div class="status-bar">
    <div class="status-time" id="statusTime">9:41</div>
    <div class="status-island"><div class="si-capsule si-minimal-capsule"></div></div>
    <div class="status-right">
      <div class="signal"><i></i><i></i><i></i><i></i></div>
      <div class="battery"><span class="bat-pct" id="batPct">76</span>
        <div class="bat-shell"><div class="bat-inner" id="batInner"></div><div class="bat-nub"></div></div></div>
    </div>
  </div>

  <div class="top-bar">
    <button class="jc-back" id="backBtn" aria-label="返回">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none"><path d="M15 5l-7 7 7 7" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <div class="top-seal">
      <span class="tts-num">G</span><span class="tts-divider"></span>
      <span class="tts-col"><span class="tts-cn">素材库</span><span class="tts-en">IMAGE&nbsp;VAULT</span></span>
    </div>
    <div class="top-right-slot">
      <button class="jc-back" id="editToggle" aria-label="管理">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M6 7h12M6 12h12M6 17h8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
      </button>
    </div>
  </div>

  <div class="sub-scroll">
    <div class="gal-tabs">
      <button class="gal-tab on" data-t="bg">
        <span class="gt-cn">背景</span><span class="gt-en">BACKDROP</span><span class="gt-n" id="nBg">0</span>
      </button>
      <button class="gal-tab" data-t="avatar">
        <span class="gt-cn">头像</span><span class="gt-en">PORTRAIT</span><span class="gt-n" id="nAv">0</span>
      </button>
    </div>

    <button class="up-slab" id="upSlab">
      <span class="up-seal">
        <span class="us-ring"></span>
        <span class="us-ring2"></span>
        <span class="us-pulse"></span>
        <span class="us-core">投</span>
      </span>
      <div class="up-cn" id="upTitle">投入背景</div>
      <div class="up-en">MULTI&nbsp;UPLOAD&nbsp;·&nbsp;TAP&nbsp;TO&nbsp;SELECT</div>
      <div class="up-rule"></div>
      <div class="up-sub">支持一次选择多张。生成角色卡时会从这里随机取用；<br>若一张都没有，卡面会改用 CSS 现场绘制</div>
    </button>

    <div class="grid bg" id="grid"></div>
    <div class="gal-empty" id="galEmpty">
      <div class="ge-cn">空 无 一 物</div>
      <div class="ge-sub">先投入几张图，角色卡才有面孔与背景</div>
    </div>
  </div>

  <input type="file" id="fileMulti" accept="image/*" multiple class="jc-hide" />
  <div class="jc-toast" id="jcToast"></div>
</div></div>
<script src="jc-core.js"></script>
<script src="jc-gallery.js"></script>
</body>
</html>
