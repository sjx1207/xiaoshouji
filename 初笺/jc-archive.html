<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>角初笺 · 存档</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Bebas+Neue&family=Space+Mono:wght@400;700&family=Cormorant+Garamond:ital,wght@0,300;0,500;1,300&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="jc-base.css" />
<link rel="stylesheet" href="jc-sub.css" />
</head>
<body>
<div class="phone-wrap"><div class="phone-frame">
  <div class="bg-glow"></div>
  <div class="paper-grain"></div>

  <div class="status-bar">
    <div class="status-time" id="statusTime">9:41</div>
    <div class="status-island"><div class="si-capsule si-minimal-capsule"></div></div>
    <div class="status-right">
      <div class="signal"><i></i><i></i><i></i><i></i></div>
      <div class="battery"><span class="bat-pct" id="batPct">76</span>
        <div class="bat-shell"><div class="bat-inner" id="batInner"></div><div class="bat-nub"></div></div></div>
    </div>
  </div>

  <div class="top-bar">
    <button class="jc-back" id="backBtn" aria-label="返回">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none"><path d="M15 5l-7 7 7 7" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <div class="top-seal">
      <span class="tts-num">A</span><span class="tts-divider"></span>
      <span class="tts-col"><span class="tts-cn" id="topCn">存档</span><span class="tts-en" id="topEn">ARCHIVE</span></span>
    </div>
  </div>

  <div class="sub-scroll">
    <div class="gal-tabs">
      <button class="gal-tab on" data-t="cards">
        <span class="gt-cn">角色存档</span><span class="gt-en">CHARACTERS</span><span class="gt-n" id="nCards">0</span>
      </button>
      <button class="gal-tab" data-t="seal">
        <span class="gt-cn">心印</span><span class="gt-en">HEART SEAL</span><span class="gt-n" id="nSeal">0</span>
      </button>
    </div>

    <!-- 存档 -->
    <div id="paneCards">
      <div class="arc-grid" id="arcGrid"></div>
      <div class="gal-empty" id="arcEmpty">
        <div class="ge-cn">存 档 空 置</div>
        <div class="ge-sub">在「初见」把角色卡向右滑，即可收入此处</div>
      </div>
    </div>

    <!-- 心印 -->
    <div id="paneSeal" class="jc-hide"></div>
  </div>

  <div class="jc-toast" id="jcToast"></div>
</div></div>
<script src="jc-core.js"></script>
<script src="jc-archive.js"></script>
</body>
</html>
