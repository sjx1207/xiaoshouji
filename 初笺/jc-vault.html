<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>角初笺 · 生成库</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Bebas+Neue&family=Space+Mono:wght@400;700&family=Cormorant+Garamond:ital,wght@0,300;0,500;1,300&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="jc-base.css" />
<link rel="stylesheet" href="jc-sub.css" />
</head>
<body>
<div class="phone-wrap"><div class="phone-frame">
  <div class="bg-glow"></div>
  <div class="paper-grain"></div>

  <div class="status-bar">
    <div class="status-time" id="statusTime">9:41</div>
    <div class="status-island"><div class="si-capsule si-minimal-capsule"></div></div>
    <div class="status-right">
      <div class="signal"><i></i><i></i><i></i><i></i></div>
      <div class="battery"><span class="bat-pct" id="batPct">76</span>
        <div class="bat-shell"><div class="bat-inner" id="batInner"></div><div class="bat-nub"></div></div></div>
    </div>
  </div>

  <div class="top-bar">
    <button class="jc-back" id="backBtn" aria-label="返回">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none"><path d="M15 5l-7 7 7 7" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <div class="top-seal">
      <span class="tts-num">05</span><span class="tts-divider"></span>
      <span class="tts-col"><span class="tts-cn">生成库</span><span class="tts-en">THE&nbsp;FOUNDRY</span></span>
    </div>
    <div class="top-right-slot">
      <button class="jc-back" id="viewToggle" aria-label="切换视图">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><rect x="4" y="4" width="7" height="7" rx="1.6" stroke="currentColor" stroke-width="1.4"/><rect x="13" y="4" width="7" height="7" rx="1.6" stroke="currentColor" stroke-width="1.4"/><rect x="4" y="13" width="7" height="7" rx="1.6" stroke="currentColor" stroke-width="1.4"/><rect x="13" y="13" width="7" height="7" rx="1.6" stroke="currentColor" stroke-width="1.4"/></svg>
      </button>
    </div>
  </div>

  <div class="sub-scroll">

    <div class="fd-note">
      <span class="fd-note-mark"></span>
      <div>
        <div class="fd-note-cn">花过额度的，一个都不会丢</div>
        <div class="fd-note-sub">每一次落笺生成的角色都会自动留档在这里 —— 当时划走的、没看上的、忘了收的，都还在。可以随时取回、补进存档，或者直接开聊。</div>
      </div>
    </div>

    <div class="fd-filters" id="fdFilters">
      <button class="fd-f on" data-f="all"><span>全部</span><em id="cAll">0</em></button>
      <button class="fd-f" data-f="new"><span>未处理</span><em id="cNew">0</em></button>
      <button class="fd-f" data-f="liked"><span>已收藏</span><em id="cLiked">0</em></button>
      <button class="fd-f" data-f="passed"><span>划走的</span><em id="cPassed">0</em></button>
    </div>

    <div class="fd-grid" id="fdGrid"></div>

    <div class="gal-empty" id="fdEmpty">
      <div class="ge-cn">尚未铸过一枚</div>
      <div class="ge-sub">回到「初见」，按住落笺印生成第一批角色</div>
    </div>
  </div>

  <!-- 预览层 -->
  <div class="fd-view" id="fdView">
    <div class="fd-view-mask" id="fdViewMask"></div>
    <div class="fd-view-card">
      <div class="fd-stage" id="fdStage"></div>
      <div class="fd-acts">
        <button class="fd-act" data-act="archive"><span class="fa-cn">收入存档</span><span class="fa-en">ARCHIVE</span></button>
        <button class="fd-act" data-act="detail"><span class="fa-cn">展开全卷</span><span class="fa-en">DOSSIER</span></button>
        <button class="fd-act minor" data-act="drop"><span class="fa-cn">彻底清除</span><span class="fa-en">DISCARD</span></button>
      </div>
    </div>
  </div>

  <div class="jc-toast" id="jcToast"></div>
</div></div>
<script src="jc-core.js"></script>
<script src="jc-cardart.js"></script>
<script src="jc-vault.js"></script>
</body>
</html>
