<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>角初笺 · 预设</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Bebas+Neue&family=Space+Mono:wght@400;700&family=Cormorant+Garamond:ital,wght@0,300;0,500;1,300&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="jc-base.css" />
<link rel="stylesheet" href="jc-sub.css" />
</head>
<body>
<div class="phone-wrap"><div class="phone-frame">
  <div class="bg-glow"></div>
  <div class="paper-grain"></div>

  <div class="status-bar">
    <div class="status-time" id="statusTime">9:41</div>
    <div class="status-island"><div class="si-capsule si-minimal-capsule"></div></div>
    <div class="status-right">
      <div class="signal"><i></i><i></i><i></i><i></i></div>
      <div class="battery"><span class="bat-pct" id="batPct">76</span>
        <div class="bat-shell"><div class="bat-inner" id="batInner"></div><div class="bat-nub"></div></div></div>
    </div>
  </div>

  <div class="top-bar">
    <button class="jc-back" id="backBtn" aria-label="返回">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none"><path d="M15 5l-7 7 7 7" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <div class="top-seal">
      <span class="tts-num">P</span><span class="tts-divider"></span>
      <span class="tts-col"><span class="tts-cn">预设</span><span class="tts-en">PRESET&nbsp;RANGE</span></span>
    </div>
  </div>

  <div class="sub-scroll" id="presetRoot"></div>

  <div class="sub-dock">
    <button class="dock-minor" id="clearBtn">清 空</button>
    <button class="dock-major" id="saveBtn">存 为 预 设</button>
  </div>

  <div class="jc-toast" id="jcToast"></div>
</div></div>
<script src="jc-core.js"></script>
<script src="jc-preset.js"></script>
</body>
</html>
