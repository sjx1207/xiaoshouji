<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>角初笺 · 详情</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Bebas+Neue&family=Space+Mono:wght@400;700&family=Cormorant+Garamond:ital,wght@0,300;0,500;1,300&family=Playfair+Display:wght@700;900&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="jc-base.css" />
<link rel="stylesheet" href="jc-detail.css" />
</head>
<body>
<div class="phone-wrap"><div class="phone-frame is-dark-chrome" id="frame">
  <div class="bg-glow"></div>

  <!-- 顶部大图：状态栏 / 顶栏 / 头图共用同一张背景 -->
  <div class="dt-hero-veil" id="heroVeil">
    <div class="dhv-frame" id="heroFrame"><span class="dhv-guilloche"></span></div>
    <span class="dhv-scrim"></span>
  </div>

  <div class="status-bar">
    <div class="status-time" id="statusTime">9:41</div>
    <div class="status-island"><div class="si-capsule si-minimal-capsule"></div></div>
    <div class="status-right">
      <div class="signal"><i></i><i></i><i></i><i></i></div>
      <div class="battery"><span class="bat-pct" id="batPct">76</span>
        <div class="bat-shell"><div class="bat-inner" id="batInner"></div><div class="bat-nub"></div></div></div>
    </div>
  </div>

  <div class="top-bar">
    <button class="jc-back dt-back" id="backBtn" aria-label="返回">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none"><path d="M15 5l-7 7 7 7" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <div class="top-right-slot">
      <button class="jc-back dt-back" id="saveBtn" aria-label="收入存档">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M6.6 4.6h10.8v14.8L12 16.2l-5.4 3.2V4.6z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg>
      </button>
    </div>
  </div>

  <div class="dt-scroll" id="dtScroll">

    <!-- 身份区 -->
    <header class="dt-head">
      <div class="dt-av" id="dtAv"><span class="dav-frame"></span><span id="dtAvGlyph">笺</span></div>
      <div class="dt-name-row">
        <span class="dt-name" id="dtName">—</span>
        <span class="dt-en" id="dtEn"></span>
      </div>
      <div class="dt-tag" id="dtTag"></div>
      <div class="dt-chips" id="dtChips"></div>
    </header>

    <!-- 展卷交互：拖动蜡印横向拉开卷轴，生成完整资料 -->
    <section class="unfurl" id="unfurl">
      <div class="uf-rail">
        <span class="uf-fill" id="ufFill"></span>
        <span class="uf-ticks"></span>
        <span class="uf-label" id="ufLabel">拖动蜡印，展开此人全卷</span>
        <span class="uf-en">DRAG&nbsp;THE&nbsp;WAX&nbsp;SEAL&nbsp;TO&nbsp;UNFURL</span>
        <button class="uf-knob" id="ufKnob">
          <span class="knob-ring"></span>
          <span class="knob-core">卷</span>
        </button>
      </div>
    </section>

    <!-- 全卷内容 -->
    <div class="dossier" id="dossier"></div>

    <!-- 关联与进入聊天 -->
    <section class="dt-actions" id="dtActions">
      <button class="link-plate" id="linkPlate">
        <span class="lp-glow"></span>
        <span class="lp-col">
          <span class="lp-cn">生成专属通讯码</span>
          <span class="lp-en">ISSUE&nbsp;LUNA&nbsp;ID&nbsp;&amp;&nbsp;CODE</span>
          <span class="lp-desc">用于在 Chat 中把这位角色加为好友</span>
        </span>
        <span class="lp-mark">
          <svg viewBox="0 0 24 24" fill="none"><path d="M9.4 14.6l5.2-5.2M7.4 12.2l-1.6 1.6a3.4 3.4 0 004.8 4.8l1.6-1.6M16.6 11.8l1.6-1.6a3.4 3.4 0 00-4.8-4.8l-1.6 1.6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
        </span>
      </button>

      <button class="talk-plate" id="talkPlate">
        <span class="tp-sheen"></span>
        <span class="tp-cn">与之交谈</span>
        <span class="tp-en">OPEN&nbsp;THE&nbsp;THREAD</span>
        <span class="tp-arrow">
          <svg viewBox="0 0 24 24" fill="none"><path d="M5 12h13M13 6.5l5.5 5.5L13 17.5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </span>
      </button>
    </section>

    <div class="dt-tail">角初笺 · 此卷仅为虚构</div>
  </div>

  <!-- 通讯码弹窗 -->
  <div class="jc-sheet-mask" id="codeMask"></div>
  <div class="jc-sheet" id="codeSheet">
    <div class="jc-grip"></div>
    <div id="codeBody"></div>
  </div>

  <div class="jc-toast" id="jcToast"></div>
</div></div>
<script src="jc-core.js"></script>
<script src="jc-detail.js"></script>
</body>
</html>
