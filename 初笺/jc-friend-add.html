<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>加好友 · ADD FRIEND</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Bebas+Neue&family=Space+Mono:wght@400;700&family=Cormorant+Garamond:ital,wght@0,300;0,500;1,300&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="jc-base.css" />
<link rel="stylesheet" href="jc-friend-add.css" />
</head>
<body>
<div class="phone-wrap"><div class="phone-frame">
  <div class="bg-glow"></div>
  <div class="paper-grain"></div>

  <div class="status-bar">
    <div class="status-time" id="statusTime">9:41</div>
    <div class="status-island"><div class="si-capsule si-minimal-capsule"></div></div>
    <div class="status-right">
      <div class="signal"><i></i><i></i><i></i><i></i></div>
      <div class="battery"><span class="bat-pct" id="batPct">76</span>
        <div class="bat-shell"><div class="bat-inner" id="batInner"></div><div class="bat-nub"></div></div></div>
    </div>
  </div>

  <div class="top-bar">
    <button class="jc-back" id="backBtn" aria-label="返回">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none"><path d="M15 5l-7 7 7 7" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <div class="top-seal">
      <span class="tts-num">04</span><span class="tts-divider"></span>
      <span class="tts-col"><span class="tts-cn">加好友</span><span class="tts-en">ADD&nbsp;FRIEND</span></span>
    </div>
  </div>

  <div class="fa-scroll">

    <!-- 验码台 -->
    <section class="verify">
      <div class="vf-head">
        <span class="vf-cn">凭 码 相 认</span>
        <span class="vf-en">ENTER&nbsp;THE&nbsp;LUNA&nbsp;ID&nbsp;ISSUED&nbsp;IN&nbsp;角初笺</span>
      </div>

      <div class="vf-id-wrap">
        <span class="vf-lb">LUNA ID</span>
        <input class="vf-id" id="idInput" placeholder="LUNA-XXXX-XXXX" autocomplete="off" spellcheck="false" />
      </div>

      <div class="vf-code-wrap">
        <span class="vf-lb">VERIFY CODE</span>
        <div class="code-cells" id="codeCells">
          <input class="cell" maxlength="1" inputmode="numeric" />
          <input class="cell" maxlength="1" inputmode="numeric" />
          <input class="cell" maxlength="1" inputmode="numeric" />
          <input class="cell" maxlength="1" inputmode="numeric" />
          <input class="cell" maxlength="1" inputmode="numeric" />
          <input class="cell" maxlength="1" inputmode="numeric" />
        </div>
      </div>

      <button class="vf-btn" id="verifyBtn">
        <span class="vb-sheen"></span>
        <span>验 证 并 添 加</span>
      </button>

      <div class="vf-msg" id="vfMsg"></div>
    </section>

    <!-- 验证成功后展示的名片 -->
    <section class="fcard jc-hide" id="fcard">
      <div class="fc-bg" id="fcBg"><span class="fc-veil"></span></div>
      <div class="fc-frame"></div>
      <div class="fc-av" id="fcAv"><span id="fcAvGlyph">笺</span></div>
      <div class="fc-name" id="fcName">—</div>
      <div class="fc-en" id="fcEn"></div>
      <div class="fc-meta" id="fcMeta"></div>
      <div class="fc-seal">已 验 讫</div>
    </section>

    <!-- 待认领列表 -->
    <div class="jc-eyebrow" style="margin:26px 4px 12px;">
      <span class="jc-eyebrow-dot"></span>
      <span class="jc-eyebrow-cn">待认领</span>
      <span class="jc-eyebrow-en">PENDING&nbsp;ISSUES</span>
      <span class="jc-eyebrow-rule"></span>
      <span class="jc-eyebrow-en" id="pendCount">0</span>
    </div>
    <div class="pend-list" id="pendList"></div>
    <div class="pend-empty" id="pendEmpty">
      <div class="pe-cn">尚无签发记录</div>
      <div class="pe-sub">先在「角初笺 · 角色详情」里生成专属通讯码</div>
    </div>

    <div class="fa-tail">角初笺 × CHAT · 通讯码互通</div>
  </div>

  <div class="jc-toast" id="jcToast"></div>
</div></div>
<script src="jc-core.js"></script>
<script src="jc-friend-add.js"></script>
</body>
</html>
