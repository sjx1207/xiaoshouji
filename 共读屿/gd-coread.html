<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>共读 · 共读屿</title>
<link rel="stylesheet" href="gd-core.css">
<link rel="stylesheet" href="gd-coread.css">
</head>
<body>

<div class="gd-scroll">
  <div class="gd-topbar">
    <div class="gd-back" onclick="GD.go('gongduyu.html')">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none"><path d="M15 5l-7 7 7 7" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
    </div>
    <div class="gd-title-block">
      <div class="gd-eyebrow">Co-reading Request</div>
      <div class="gd-title">邀 请 共 读</div>
    </div>
  </div>

  <div class="cr-wrap">

    <!-- 已有会话 -->
    <div id="liveBox" style="display:none"></div>

    <div id="setupBox">
      <div class="cr-note">
        从角色档案里挑一个人，把这篇同人文递过去。<br>
        TA 会先看一眼你留的话，再决定要不要陪你读完 —— 应答之后，TA 会缩成屏幕边上的一颗悬浮球，跟着你翻页、跟着你计时。
      </div>

      <div class="gd-sec-label" style="padding:0;margin:24px 0 10px;">
        <span class="num">Ⅰ</span><span class="txt">选 择 角 色</span><span class="fill"></span>
      </div>
      <div class="cr-chars" id="charList"></div>

      <div class="gd-sec-label" style="padding:0;margin:26px 0 10px;">
        <span class="num">Ⅱ</span><span class="txt">要 一 起 读 的 篇 目</span><span class="fill"></span>
      </div>
      <div class="gd-picker ph" id="workSel">暂不指定，随便读什么都行</div>

      <div class="gd-field" style="margin-top:18px;">
        <div class="gd-label"><b>留 言</b><span>MESSAGE</span></div>
        <textarea class="gd-textarea" id="inviteMsg" placeholder="想跟 TA 说的话，比如：这篇第三段我一个人看不下去。"></textarea>
      </div>

      <button class="gd-btn" style="width:100%" id="sendInvite">发 出 邀 请</button>

      <!-- 握手过程 -->
      <div class="cr-hand" id="hand">
        <div class="wave"></div>
        <div class="cr-steps" id="steps"></div>
        <div class="cr-answer" id="answer">
          <div class="who" id="answerWho">—</div>
          <div class="say" id="answerSay">—</div>
        </div>
      </div>

      <!-- 悬浮球样式 -->
      <div id="orbBox" style="display:none">
        <div class="gd-sec-label" style="padding:0;margin:30px 0 8px;">
          <span class="num">Ⅲ</span><span class="txt">选 一 个 悬 浮 球 样 式</span><span class="fill"></span>
        </div>
        <div style="font-size:11.5px;color:var(--ink-4);line-height:1.9;">这是 TA 停在你屏幕上的样子。可以随时更换。</div>
        <div class="orb-grid" id="orbGrid"></div>
        <button class="gd-btn" style="width:100%;margin-top:22px;" id="confirmOrb">确 认 并 开 始 共 读</button>
      </div>
    </div>

  </div>
</div>

<script src="gd-core.js"></script>
<script src="gd-fab.js"></script>
<script src="gd-coread.js"></script>
</body>
</html>
