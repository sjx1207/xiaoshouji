<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Chat Setting</title>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Cormorant+Garamond:ital,wght@0,300;1,300&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;700;900&display=swap" rel="stylesheet"/>

<link rel="stylesheet" href="chat.css" />
<link rel="stylesheet" href="chatroom.css" />
<link rel="stylesheet" href="chatsetting.css" />
</head>
<body data-crm-guard="pending">

<div class="phone-wrap">
<div class="phone-frame crm-frame cst-frame">

  <div class="bg-glow"></div>

  <!-- ============ 拦截层：与聊天室共用同一套会话令牌校验 ============ -->
  <div class="crm-guard" id="cstGuard" aria-hidden="true">
    <div class="crm-guard-seal" aria-hidden="true">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none"><path d="M15.5 3.2C11.4 4.4 8.5 8.2 8.5 12.5C8.5 16.8 11.4 20.6 15.5 21.8C13.9 22.4 12.2 22.7 10.5 22.4C5.6 21.6 2 17.4 2 12.5C2 7.6 5.6 3.4 10.5 2.6C12.2 2.3 13.9 2.6 15.5 3.2Z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></svg>
    </div>
    <div class="crm-guard-cn">需从聊天室进入</div>
    <div class="crm-guard-en">ACCESS&nbsp;VIA&nbsp;CHATROOM&nbsp;ONLY</div>
    <a class="crm-guard-btn" href="chat.html">返回好友列表</a>
  </div>

  <!-- ============ 状态栏：与主状态栏同源同步 ============ -->
  <div class="status-bar">
    <div class="status-time" id="statusTime">9:41</div>
    <div class="status-island">
      <div class="si-capsule si-minimal-capsule"></div>
    </div>
    <div class="status-right">
      <div class="signal">
        <i></i><i></i><i></i><i></i>
      </div>
      <div class="battery">
        <span class="bat-pct" id="batPct">76</span>
        <div class="bat-shell">
          <div class="bat-inner" id="batInner"></div>
          <div class="bat-nub"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- ============ 顶栏：返回 · 印玺题名 · 占位配平 ============ -->
  <div class="crm-top-bar cst-top-bar" id="cstTopBar">
    <button class="crm-back-btn" id="cstBackBtn" aria-label="返回聊天室">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none"><path d="M14.5 5L7.5 12L14.5 19" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>

    <div class="cst-title-seal">
      <span class="cst-title-row">
        <span class="cst-title-cn">聊天设置</span>
        <span class="cst-title-en">CHAT&nbsp;SETTING</span>
      </span>
      <span class="cst-title-peer" id="cstPeerLine">与「好友昵称」的专属设置</span>
    </div>

    <span class="cst-top-spacer" aria-hidden="true"></span>
  </div>

  <!-- ============ 内容滚动区 ============ -->
  <div class="cst-scroll" id="cstScroll">
    <div class="cst-scroll-inner">

      <!-- ---- 分组题额 ---- -->
      <div class="cst-section-head">
        <span class="cst-section-seal" aria-hidden="true">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none"><path d="M4 17L9.5 9.5L13.2 13.6L20 5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M20 5V10.2M20 5H14.8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </span>
        <span class="cst-section-title-cn">聊天背景</span>
        <span class="cst-section-title-en">CHAT&nbsp;BACKGROUND</span>
      </div>

      <!-- ---- 预览牌：还原聊天室气泡样式，实时反映当前选择 ---- -->
      <div class="cst-preview-card">
        <div class="cst-preview-frame">
          <div class="cst-preview-bg" id="cstPreviewBg">
            <div class="cst-preview-empty" id="cstPreviewEmpty">
              <span class="cst-preview-empty-seal" aria-hidden="true">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M15.5 3.2C11.4 4.4 8.5 8.2 8.5 12.5C8.5 16.8 11.4 20.6 15.5 21.8C13.9 22.4 12.2 22.7 10.5 22.4C5.6 21.6 2 17.4 2 12.5C2 7.6 5.6 3.4 10.5 2.6C12.2 2.3 13.9 2.6 15.5 3.2Z" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/></svg>
              </span>
              <span class="cst-preview-empty-text">默认月光纸面</span>
            </div>
            <img class="cst-preview-media" id="cstPreviewImg" alt="" hidden />
            <video class="cst-preview-media" id="cstPreviewVideo" muted loop autoplay playsinline hidden></video>
            <div class="cst-preview-scrim" id="cstPreviewScrim"></div>
          </div>
          <div class="cst-preview-mock">
            <div class="cst-preview-bubble is-peer">
              <span class="cst-preview-bubble-line"></span>
              <span class="cst-preview-bubble-line short"></span>
            </div>
            <div class="cst-preview-bubble is-me">
              <span class="cst-preview-bubble-line"></span>
            </div>
          </div>
        </div>
        <div class="cst-preview-caption">
          <span class="cst-preview-caption-cn" id="cstPreviewLabel">当前：默认</span>
          <span class="cst-preview-caption-en">LIVE&nbsp;PREVIEW</span>
        </div>
      </div>

      <!-- ---- 作用范围：全局 / 专属此角色 ---- -->
      <div class="cst-scope-row">
        <button class="cst-scope-btn is-active" id="cstScopeGlobal" data-scope="global" type="button">
          <span class="cst-scope-label-cn">全局背景</span>
          <span class="cst-scope-label-en">GLOBAL</span>
        </button>
        <button class="cst-scope-btn" id="cstScopeChar" data-scope="char" type="button">
          <span class="cst-scope-label-cn">仅此角色</span>
          <span class="cst-scope-label-en">THIS&nbsp;CHAT</span>
        </button>
      </div>
      <div class="cst-scope-hint" id="cstScopeHint">应用于所有未单独设置的聊天室</div>

      <!-- ---- 来源选择：本地上传 / 网络链接 ---- -->
      <div class="cst-source-grid">
        <label class="cst-source-card" for="cstFileInput">
          <span class="cst-source-icon" aria-hidden="true">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M12 15.5V4.5M12 4.5L7.5 9M12 4.5L16.5 9" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M5 15.5V17.8C5 18.9 5.9 19.8 7 19.8H17C18.1 19.8 19 18.9 19 17.8V15.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </span>
          <span class="cst-source-title">本地上传</span>
          <span class="cst-source-sub">图片 · 视频</span>
          <input type="file" id="cstFileInput" accept="image/*,video/*" hidden />
        </label>

        <button class="cst-source-card" id="cstUrlCard" type="button">
          <span class="cst-source-icon" aria-hidden="true">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M9.5 14.5L14.5 9.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><path d="M11 7.2L12.4 5.8C13.9 4.3 16.3 4.3 17.7 5.8C19.2 7.2 19.2 9.6 17.7 11.1L16.3 12.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M13 16.8L11.6 18.2C10.1 19.7 7.7 19.7 6.3 18.2C4.8 16.8 4.8 14.4 6.3 12.9L7.7 11.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </span>
          <span class="cst-source-title">网络链接</span>
          <span class="cst-source-sub">图片 · 视频 URL</span>
        </button>
      </div>

      <!-- ---- URL 输入区：点击「网络链接」卡片后展开 ---- -->
      <div class="cst-url-panel" id="cstUrlPanel" aria-hidden="true">
        <div class="cst-url-field">
          <input type="text" id="cstUrlInput" class="cst-url-input" placeholder="粘贴图片或视频链接 https://..." autocomplete="off" spellcheck="false" />
          <button class="cst-url-go" id="cstUrlGo" type="button">解析</button>
        </div>
        <div class="cst-url-msg" id="cstUrlMsg"></div>
      </div>

      <!-- ---- 显示方式 ---- -->
      <div class="cst-section-head cst-section-head-tight">
        <span class="cst-section-seal" aria-hidden="true">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none"><rect x="4" y="4.5" width="16" height="15" rx="1.6" stroke="currentColor" stroke-width="1.5"/><path d="M4 14.5L9 10L13 13.5L20 8" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </span>
        <span class="cst-section-title-cn">显示方式</span>
        <span class="cst-section-title-en">DISPLAY</span>
      </div>

      <div class="cst-fit-row" id="cstFitRow">
        <button class="cst-fit-btn is-active" data-fit="cover" type="button">
          <span class="cst-fit-cn">铺满</span><span class="cst-fit-en">COVER</span>
        </button>
        <button class="cst-fit-btn" data-fit="contain" type="button">
          <span class="cst-fit-cn">完整</span><span class="cst-fit-en">CONTAIN</span>
        </button>
      </div>

      <div class="cst-dim-row">
        <span class="cst-dim-label">
          <span class="cst-dim-label-cn">气泡区遮罩</span>
          <span class="cst-dim-label-en">SCRIM</span>
        </span>
        <input type="range" id="cstDimSlider" class="cst-dim-slider" min="0" max="80" value="30" />
      </div>

      <!-- ---- 底部操作：恢复默认 / 保存 ---- -->
      <div class="cst-action-row">
        <button class="cst-reset-btn" id="cstResetBtn" type="button">恢复默认</button>
        <button class="cst-save-btn" id="cstSaveBtn" type="button">
          <span class="cst-save-btn-cn">保存</span>
          <span class="cst-save-btn-en">SAVE</span>
        </button>
      </div>

      <div class="cst-bottom-pad" aria-hidden="true"></div>
    </div>
  </div>

  <!-- ============ 保存回执：轻量印记浮层，非通用 toast 条 ============ -->
  <div class="cst-toast" id="cstToast" aria-hidden="true">
    <span class="cst-toast-seal" aria-hidden="true">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none"><path d="M5 12.5L9.5 17L19 6.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </span>
    <span class="cst-toast-text" id="cstToastText">已保存</span>
  </div>

</div>
</div>

<script src="chat.js"></script>
<script src="chatsetting.js"></script>
</body>
</html>
