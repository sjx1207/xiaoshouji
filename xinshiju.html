<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<title>心事局</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@200;300;400;500;600;700;900&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,400&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="xinshiju.css"/>
</head>
<body>

<div class="xj-wrap" id="xjWrap">

  <!-- ================= 深海层叠背景 ================= -->
  <div class="xj-deepsea">
    <div class="xj-sea-gradient"></div>
    <div class="xj-sea-caustics"></div>
    <div class="xj-sea-caustics xj-sea-caustics--b"></div>
    <div class="xj-sea-rays"></div>

    <!-- 海底剪影：远景礁石与珊瑚，锚定画面下方 -->
    <div class="xj-seabed" id="xjSeabed"></div>

    <!-- 远景水母群 -->
    <div class="xj-jellies" id="xjJellies"></div>

    <!-- 游鱼群：细小的暗色鱼形剪影缓慢穿行 -->
    <div class="xj-fishes" id="xjFishes"></div>

    <!-- 上升气泡 -->
    <div class="xj-bubbles" id="xjBubbles"></div>

    <!-- 漂浮微粒 / 浮游生物光点 -->
    <div class="xj-motes" id="xjMotes"></div>

    <div class="xj-sea-vignette"></div>
    <div class="xj-sea-grain"></div>
  </div>

  <!-- 说明：原先这里还定义了 xjWaterWarp（动态 feTurbulence + feDisplacementMap）
       与 xjSoftGlow（feGaussianBlur）两个 SVG 滤镜，分别用于焦散水纹扭曲与
       水母柔光。这两个滤镜即便"看起来只是背景装饰"，其内部逐帧变化的
       <animate> 在移动端浏览器里几乎完全跑在 CPU 上、无法被 GPU 合成，
       是导致整页动画在手机上卡顿掉帧的最主要原因，因此已彻底移除，
       相应视觉效果改由纯 CSS transform/opacity 与预生成渐变实现。 -->
  <svg class="xj-defs" width="0" height="0">
    <defs>
      <radialGradient id="jellyBell" cx="50%" cy="35%" r="65%">
        <stop offset="0%" stop-color="rgba(180,225,255,0.55)"/>
        <stop offset="55%" stop-color="rgba(120,190,255,0.22)"/>
        <stop offset="100%" stop-color="rgba(90,160,255,0)"/>
      </radialGradient>
    </defs>
  </svg>

  <!-- ========== 状态栏 ========== -->
  <div class="status-bar">
    <div class="status-time" id="statusTime">9:41</div>
    <div class="status-island" id="statusIsland"></div>
    <div class="status-right">
      <div class="signal"><i></i><i></i><i></i><i></i></div>
      <div class="battery">
        <span class="bat-pct" id="batPct">76</span>
        <div class="bat-shell">
          <div class="bat-inner" id="batInner"></div>
          <div class="bat-nub"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- ========== 头部题头 ========== -->
  <div class="xj-header">
    <button class="xj-back" onclick="goBack()">
      <svg viewBox="0 0 24 24" width="17" height="17" fill="none">
        <path d="M15 18l-6-6 6-6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>

    <div class="xj-title-block">
      <div class="xj-eyebrow">
        <span class="xj-eyebrow-mark"></span>
        <span>深处 · 无光带</span>
      </div>
      <h1 class="xj-title">心事局</h1>
      <div class="xj-subtitle">沉入深海 · 说给黑暗听</div>
    </div>

    <button class="xj-archive-btn" onclick="openArchive()" title="信匣">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none">
        <path d="M3 8.5 12 14l9-5.5M4.5 6.5h15A1.5 1.5 0 0 1 21 8v10a1.5 1.5 0 0 1-1.5 1.5h-15A1.5 1.5 0 0 1 3 18V8a1.5 1.5 0 0 1 1.5-1.5Z" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <span class="xj-archive-dot" id="xjArchiveDot" style="display:none;"></span>
    </button>
  </div>

  <!-- ========== 深潜对象：当前倾诉对象（点击可换） ========== -->
  <button class="xj-diver-bar" id="xjDiverBar" onclick="openDiverPicker()" style="display:none;">
    <span class="xj-diver-seal" id="xjDiverSeal"></span>
    <span class="xj-diver-text">
      <span class="xj-diver-label">此刻潜向</span>
      <span class="xj-diver-name" id="xjDiverName">未择人</span>
    </span>
    <svg class="xj-diver-caret" viewBox="0 0 24 24" width="13" height="13" fill="none">
      <path d="M6 9l6 6 6-6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </button>

  <!-- ========== 中央主舞台：深海静置态 ========== -->
  <div class="xj-stage" id="xjStage">

    <!-- 待命态：发光核心 · 点击唤醒 -->
    <div class="xj-idle" id="xjIdle">

      <div class="xj-orb-field" id="xjOrbField">
        <div class="xj-orb-ring xj-orb-ring--1"></div>
        <div class="xj-orb-ring xj-orb-ring--2"></div>
        <div class="xj-orb-ring xj-orb-ring--3"></div>

        <!-- 环绕光球公转的微粒轨道 -->
        <div class="xj-orb-orbit" id="xjOrbOrbit"></div>

        <button class="xj-orb" id="xjOrb" onclick="awakenOrb()" aria-label="唤醒">
          <span class="xj-orb-core"></span>
          <span class="xj-orb-inner-glow"></span>
          <span class="xj-orb-highlight"></span>
          <span class="xj-orb-sparks" id="xjOrbSparks"></span>
        </button>

        <div class="xj-orb-caption">
          <span class="xj-orb-caption-line xj-orb-caption-line--l"></span>
          <div class="xj-orb-caption-text">
            <div class="xj-orb-caption-main">轻触，沉入</div>
            <div class="xj-orb-caption-sub">TOUCH TO DESCEND</div>
          </div>
          <span class="xj-orb-caption-line xj-orb-caption-line--r"></span>
        </div>
      </div>

    </div>

    <!-- 唤醒态：书写深处（仅承担输入仪式，提交后自身连同文字一起飘散退场） -->
    <div class="xj-abyss" id="xjAbyss">
      <div class="xj-abyss-return">
        <button class="xj-abyss-close" onclick="closeAbyss()" aria-label="返回水面">
          <svg viewBox="0 0 24 24" width="15" height="15" fill="none">
            <path d="M12 5v14M5 12l7 7 7-7" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <span>返回水面</span>
        </button>
      </div>

      <div class="xj-abyss-content" id="xjAbyssContent">
        <div class="xj-abyss-mark">〇</div>
        <div class="xj-abyss-prompt">此刻，你想说些什么</div>
        <div class="xj-abyss-hint">文字会沉入深处，静静地被听见</div>

        <div class="xj-abyss-field">
          <textarea
            id="xjInput"
            class="xj-abyss-textarea"
            placeholder="在这里写下心事……"
            rows="1"
            maxlength="2000"
          ></textarea>
          <div class="xj-abyss-field-line"></div>
        </div>

        <div class="xj-abyss-foot">
          <span class="xj-input-count" id="xjInputCount">0 / 2000</span>
          <button class="xj-abyss-send" id="xjSendBtn" onclick="submitEntry()">
            <span class="xj-abyss-send-label">投入深海</span>
            <span class="xj-abyss-send-ripple"></span>
          </button>
        </div>
      </div>
    </div>

    <!-- 沉浸回响舞台：AI生成内容的唯一呈现场所，无对话结构，纯文字与动画交织 -->
    <div class="xj-echo-stage" id="xjEchoStage">
      <button class="xj-echo-surface" id="xjEchoSurface" onclick="surfaceFromEcho()" aria-label="浮回水面">
        <svg viewBox="0 0 24 24" width="15" height="15" fill="none">
          <path d="M12 19V5M5 12l7-7 7 7" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span>浮回水面</span>
      </button>
      <div class="xj-echo-canvas" id="xjEchoCanvas"></div>
    </div>

  </div>

</div>

<!-- ========== 深潜对象选择抽屉 ========== -->
<div class="xj-diver-mask" id="xjDiverMask" onclick="closeDiverPicker(event)">
  <div class="xj-diver-panel" id="xjDiverPanel" onclick="event.stopPropagation()">
    <div class="xj-archive-handle"></div>
    <div class="xj-diver-header">
      <div class="xj-archive-title">潜向何人</div>
      <div class="xj-archive-sub">选择此刻要说给谁听 · 共 <span id="xjDiverCount">0</span> 位</div>
    </div>
    <div class="xj-diver-grid" id="xjDiverGrid"></div>
  </div>
</div>

<!-- ========== 信匣 · 深海漂浮档案 ========== -->
<div class="xj-archive-mask" id="xjArchiveMask">
  <div class="xj-archive-panel" id="xjArchivePanel">

    <div class="xj-archive-seascape">
      <div class="xj-sea-gradient"></div>
      <div class="xj-sea-caustics"></div>
      <div class="xj-sea-rays"></div>
      <div class="xj-jellies" id="xjArchiveJellies"></div>
      <div class="xj-fishes" id="xjArchiveFishes"></div>
      <div class="xj-bubbles" id="xjArchiveBubbles"></div>
      <div class="xj-motes" id="xjArchiveMotes"></div>
      <div class="xj-sea-vignette"></div>
      <div class="xj-sea-grain"></div>
    </div>

    <!-- 信匣内也保留状态栏，维持"仍在同一部手机里"的连续感 -->
    <div class="status-bar">
      <div class="status-time">9:41</div>
      <div class="status-island"></div>
      <div class="status-right">
        <div class="signal"><i></i><i></i><i></i><i></i></div>
        <div class="battery">
          <span class="bat-pct">76</span>
          <div class="bat-shell"><div class="bat-inner"></div><div class="bat-nub"></div></div>
        </div>
      </div>
    </div>

    <div class="xj-archive-handle"></div>
    <div class="xj-archive-header">
      <div>
        <div class="xj-archive-title">信匣</div>
        <div class="xj-archive-sub">已存 <span id="xjArchiveTotal">0</span> 函心事 · 轻触一函，令其汇聚</div>
      </div>
      <button class="xj-archive-close" onclick="closeArchive()">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none">
          <path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
        </svg>
      </button>
    </div>

    <div class="xj-archive-sea" id="xjArchiveSea"></div>
  </div>
</div>

<!-- ========== 信函详情 · 深海全屏显影 ========== -->
<div class="xj-detail-mask" id="xjDetailMask">
  <div class="xj-detail-panel" id="xjDetailPanel">

    <div class="xj-detail-seascape">
      <div class="xj-sea-gradient"></div>
      <div class="xj-sea-caustics"></div>
      <div class="xj-sea-rays"></div>
      <div class="xj-jellies" id="xjDetailJellies"></div>
      <div class="xj-fishes" id="xjDetailFishes"></div>
      <div class="xj-bubbles" id="xjDetailBubbles"></div>
      <div class="xj-motes" id="xjDetailMotes"></div>
      <div class="xj-sea-vignette"></div>
      <div class="xj-sea-grain"></div>
    </div>

    <!-- 状态栏同样保留于详情页 -->
    <div class="status-bar">
      <div class="status-time">9:41</div>
      <div class="status-island"></div>
      <div class="status-right">
        <div class="signal"><i></i><i></i><i></i><i></i></div>
        <div class="battery">
          <span class="bat-pct">76</span>
          <div class="bat-shell"><div class="bat-inner"></div><div class="bat-nub"></div></div>
        </div>
      </div>
    </div>

    <div class="xj-detail-header">
      <button class="xj-detail-back" onclick="closeDetail()">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none">
          <path d="M15 18l-6-6 6-6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
      <div class="xj-detail-title" id="xjDetailTitle">信函</div>
      <button class="xj-detail-del" onclick="deleteCurrentArchiveEntry()">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none">
          <path d="M4 7h16M9 7V4.8A1 1 0 0 1 10 4h4a1 1 0 0 1 1 1.2V7M7 7l1 12.2A2 2 0 0 0 10 21h4a2 2 0 0 0 2-1.8L17 7" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
    </div>
    <div class="xj-detail-body" id="xjDetailBody"></div>
  </div>
</div>

<!-- 角色遴选卷已隐藏保留（逻辑仍在运行，供后续接入），不在此版视觉中展示 -->
<div id="xjRosterTrack" hidden></div>
<div id="xjRosterEmpty" hidden></div>
<div id="xjRosterCount" hidden></div>
<div id="xjSessionCount" hidden></div>
<div id="xjActiveChar" hidden>
  <div id="xjActiveCharSeal"></div>
  <div id="xjActiveCharName"></div>
</div>

<!-- ========== 提示 Toast ========== -->
<div class="xj-toast" id="xjToast"></div>

<script src="xinshiju.js"></script>
</body>
</html>
